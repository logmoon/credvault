name: CI/CD

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: install frontend dependencies
        run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: test
        run: cargo test
        working-directory: src-tauri

  publish-tauri:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage,rpm'
          - platform: windows-latest
            args: '--bundles msi,nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CredVault ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  update-pkgbuild:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Sync pkgver and pkgrel from tag
        id: sync
        run: |
          tagver="${GITHUB_REF_NAME#v}"
          current_pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          current_pkgrel=$(sed -n 's/^pkgrel=//p' packaging/arch/PKGBUILD)
          if [ "$current_pkgver" = "$tagver" ]; then
            new_pkgrel=$((current_pkgrel + 1))
          else
            new_pkgrel=1
          fi
          sed -i "s/^pkgver=.*/pkgver=$tagver/" packaging/arch/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=$new_pkgrel/" packaging/arch/PKGBUILD
          echo "pkgver=$tagver" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$new_pkgrel" >> "$GITHUB_OUTPUT"

      # REASON: GITHUB_TOKEN is audience-scoped to api.github.com and is rejected
      # by codeload (404) — the archive must be fetched with a repo PAT when the
      # repo is private, or anonymously once public. The gzip check hard-fails on
      # any non-archive response so a 404 body can never be hashed and committed.
      - name: Compute source tarball sha256
        id: hash
        run: |
          if [ -n "${{ secrets.GH_PKG_TOKEN }}" ]; then
            AUTH_HEADER=(-H "Authorization: token ${{ secrets.GH_PKG_TOKEN }}")
          else
            AUTH_HEADER=()
          fi
          curl -sSL --location-trusted "${AUTH_HEADER[@]}" -o source.tar.gz \
            "https://github.com/logmoon/credvault/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          if ! file source.tar.gz | grep -q "gzip compressed"; then
            echo "::error::Downloaded source is not a gzip archive (private repo without GH_PKG_TOKEN secret?)"
            exit 1
          fi
          echo "sha256=$(sha256sum source.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD checksum
        run: |
          sed -i "s/sha256sums=('[a-f0-9]*')/sha256sums=('${{ steps.hash.outputs.sha256 }}')/" packaging/arch/PKGBUILD

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/arch/PKGBUILD
          if git diff --cached --quiet; then
            echo "PKGBUILD unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(arch): sync PKGBUILD to ${{ github.ref_name }} (pkgrel ${{ steps.sync.outputs.pkgrel }})"
          git push origin master
