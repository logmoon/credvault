name: CI/CD

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: install frontend dependencies
        run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: test
        run: cargo test
        working-directory: src-tauri

  publish-tauri:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage,rpm'
          - platform: windows-latest
            args: '--bundles msi,nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CredVault ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  update-pkgbuild:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Compute source tarball sha256
        id: hash
        run: |
          curl -sSL --location-trusted -o source.tar.gz \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://github.com/logmoon/credvault/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          echo "sha256=$(sha256sum source.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD checksum
        run: |
          sed -i "s/sha256sums=('[a-f0-9]*')/sha256sums=('${{ steps.hash.outputs.sha256 }}')/" packaging/arch/PKGBUILD

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/arch/PKGBUILD
          if git diff --cached --quiet; then
            echo "Checksum unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(arch): update PKGBUILD checksum for ${{ github.ref_name }}"
          git push origin master
